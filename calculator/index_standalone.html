<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Smart Calculator (Standalone)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- React & Babel via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', Arial, sans-serif;
      background: #f4f6fb;
      color: #1e293b;
    }

    .app {
      min-height: 100vh;
      padding-bottom: 50px;
    }

    header {
      text-align: center;
      padding: 30px 20px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      margin-bottom: 30px;
      box-shadow: 0 4px 20px rgba(79, 70, 229, 0.25);
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    header p {
      font-size: 16px;
      opacity: 0.9;
    }

    .summary {
      width: 92%;
      max-width: 1050px;
      margin: 0 auto 30px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .summary-card {
      width: 220px;
      padding: 22px;
      border-radius: 16px;
      text-align: center;
      background: white;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
      transition: 0.3s transform, 0.3s box-shadow;
    }

    .summary-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    .summary-card h3 {
      color: #64748b;
      font-size: 15px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .summary-card p {
      font-size: 34px;
      font-weight: bold;
      margin-top: 8px;
    }

    .total {
      border-top: 5px solid #4f46e5;
    }
    .total p {
      color: #4f46e5;
    }

    .present-card {
      border-top: 5px solid #16a34a;
    }
    .present-card p {
      color: #16a34a;
    }

    .active-op-card {
      border-top: 5px solid #8b5cf6;
    }
    .active-op-card p {
      color: #8b5cf6;
    }

    .calculator-workspace {
      width: 92%;
      max-width: 1050px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 30px;
      flex-wrap: wrap;
    }

    .calculator-card {
      width: 380px;
      background: white;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
      border: 1px solid #e2e8f0;
    }

    .calculator-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .college-badge {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #6366f1;
      background: #e0e7ff;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .copy-btn {
      background: #f1f5f9;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      transition: 0.2s;
    }

    .copy-btn:hover {
      background: #e2e8f0;
      color: #1e293b;
    }

    .display-screen {
      background: #0f172a;
      border-radius: 16px;
      padding: 20px 22px;
      text-align: right;
      margin-bottom: 20px;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #1e293b;
    }

    .expression-line {
      color: #94a3b8;
      font-size: 15px;
      font-family: 'JetBrains Mono', monospace;
      min-height: 20px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .main-line {
      color: #ffffff;
      font-size: 40px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: -0.5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: font-size 0.15s;
    }

    .main-line.text-shrink {
      font-size: 26px;
    }

    .quick-helpers {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .quick-helpers button {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 10px 0;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      transition: 0.2s;
    }

    .quick-helpers button:hover {
      background: #eef2ff;
      color: #4f46e5;
      border-color: #c7d2fe;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .keypad button {
      height: 58px;
      border: none;
      border-radius: 14px;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .keypad button:active {
      transform: scale(0.95);
    }

    .btn-number {
      background: #f8fafc;
      color: #1e293b;
      border: 1px solid #e2e8f0;
    }

    .btn-number:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .btn-function {
      background: #fef2f2;
      color: #dc2626;
      font-weight: 700;
    }

    .btn-function:hover {
      background: #fee2e2;
    }

    .btn-operator {
      background: #e0e7ff;
      color: #4338ca;
      font-size: 22px;
    }

    .btn-operator:hover {
      background: #c7d2fe;
    }

    .btn-operator.op-selected {
      background: #4f46e5;
      color: white;
    }

    .btn-equals {
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: white;
      font-size: 24px;
      font-weight: bold;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);
    }

    .btn-equals:hover {
      background: linear-gradient(135deg, #15803d, #166534);
      box-shadow: 0 6px 16px rgba(22, 163, 74, 0.4);
    }

    .history-panel {
      flex: 1;
      min-width: 320px;
      max-width: 480px;
      background: white;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
      border: 1px solid #e2e8f0;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid #f1f5f9;
    }

    .history-header h3 {
      font-size: 18px;
      color: #334155;
    }

    .reset-btn {
      border: none;
      background: #64748b;
      color: white;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: 0.2s;
    }

    .reset-btn:hover {
      background: #475569;
      transform: scale(1.05);
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .history-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .history-item:hover {
      background: #eef2ff;
      border-color: #c7d2fe;
      transform: translateX(4px);
    }

    .history-top {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #64748b;
      margin-bottom: 4px;
      font-family: 'JetBrains Mono', monospace;
    }

    .history-time {
      font-size: 11px;
      color: #94a3b8;
    }

    .history-result {
      font-size: 20px;
      font-weight: 700;
      color: #1e293b;
      font-family: 'JetBrains Mono', monospace;
    }

    .history-empty {
      text-align: center;
      padding: 60px 20px;
      color: #94a3b8;
    }

    .empty-icon {
      font-size: 36px;
      display: block;
      margin-bottom: 10px;
    }

    .history-empty p {
      font-size: 16px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 4px;
    }

    .history-empty small {
      font-size: 13px;
    }

    @media (max-width: 820px) {
      .calculator-card {
        width: 100%;
        max-width: 420px;
      }
      .history-panel {
        width: 100%;
        max-width: 420px;
      }
    }

    @media (max-width: 500px) {
      header h1 {
        font-size: 25px;
      }
      .summary-card {
        width: 100%;
      }
      .keypad button {
        height: 52px;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function CalculatorApp() {
      const [currentInput, setCurrentInput] = useState("0");
      const [previousInput, setPreviousInput] = useState(null);
      const [operation, setOperation] = useState(null);
      const [overwrite, setOverwrite] = useState(false);
      const [history, setHistory] = useState([]);
      const [copied, setCopied] = useState(false);

      const totalCalculations = history.length;
      const lastResult = history.length > 0 ? history[0].result : "0";

      const handleNumber = (digit) => {
        if (currentInput === "Error") {
          setCurrentInput(digit);
          setOverwrite(false);
          return;
        }

        if (overwrite) {
          setCurrentInput(digit);
          setOverwrite(false);
          return;
        }

        if (currentInput === "0") {
          setCurrentInput(digit);
        } else {
          if (currentInput.length < 16) {
            setCurrentInput(currentInput + digit);
          }
        }
      };

      const handleDecimal = () => {
        if (currentInput === "Error" || overwrite) {
          setCurrentInput("0.");
          setOverwrite(false);
          return;
        }
        if (!currentInput.includes(".")) {
          setCurrentInput(currentInput + ".");
        }
      };

      const calculate = (a, b, op) => {
        const num1 = parseFloat(a);
        const num2 = parseFloat(b);
        if (isNaN(num1) || isNaN(num2)) return "0";

        let result = 0;
        switch (op) {
          case "+":
            result = num1 + num2;
            break;
          case "-":
            result = num1 - num2;
            break;
          case "×":
          case "*":
            result = num1 * num2;
            break;
          case "÷":
          case "/":
            if (num2 === 0) return "Error";
            result = num1 / num2;
            break;
          default:
            return String(num2);
        }
        return parseFloat(result.toFixed(10)).toString();
      };

      const handleOperator = (op) => {
        if (currentInput === "Error") return;

        if (previousInput !== null && operation && !overwrite) {
          const result = calculate(previousInput, currentInput, operation);
          if (result === "Error") {
            setCurrentInput("Error");
            setPreviousInput(null);
            setOperation(null);
            setOverwrite(true);
            return;
          }
          setPreviousInput(result);
          setCurrentInput(String(result));
        } else {
          setPreviousInput(currentInput);
        }

        setOperation(op);
        setOverwrite(true);
      };

      const handleEquals = () => {
        if (!operation || previousInput === null || currentInput === "Error") return;

        const expressionStr = `${previousInput} ${operation} ${currentInput}`;
        const result = calculate(previousInput, currentInput, operation);

        if (result === "Error") {
          setCurrentInput("Error");
          setPreviousInput(null);
          setOperation(null);
          setOverwrite(true);
          return;
        }

        const newEntry = {
          id: Date.now(),
          expression: expressionStr,
          result: result,
          time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })
        };

        setHistory((prev) => [newEntry, ...prev.slice(0, 19)]);
        setCurrentInput(result);
        setPreviousInput(null);
        setOperation(null);
        setOverwrite(true);
      };

      const handleAllClear = () => {
        setCurrentInput("0");
        setPreviousInput(null);
        setOperation(null);
        setOverwrite(false);
      };

      const handleDelete = () => {
        if (currentInput === "Error" || overwrite) {
          setCurrentInput("0");
          setOverwrite(false);
          return;
        }

        if (currentInput.length > 1) {
          setCurrentInput(currentInput.slice(0, -1));
        } else {
          setCurrentInput("0");
        }
      };

      const handleToggleSign = () => {
        if (currentInput === "0" || currentInput === "Error") return;
        if (currentInput.startsWith("-")) {
          setCurrentInput(currentInput.substring(1));
        } else {
          setCurrentInput("-" + currentInput);
        }
      };

      const handlePercentage = () => {
        if (currentInput === "Error") return;
        const value = parseFloat(currentInput);
        if (!isNaN(value)) {
          const result = parseFloat((value / 100).toFixed(10)).toString();
          setCurrentInput(result);
          setOverwrite(true);
        }
      };

      const handleQuickMath = (type) => {
        if (currentInput === "Error") return;
        const val = parseFloat(currentInput);
        if (isNaN(val)) return;

        let res = 0;
        let label = "";

        if (type === "sq") {
          res = Math.pow(val, 2);
          label = `sqr(${val})`;
        } else if (type === "sqrt") {
          if (val < 0) {
            setCurrentInput("Error");
            return;
          }
          res = Math.sqrt(val);
          label = `√(${val})`;
        } else if (type === "inv") {
          if (val === 0) {
            setCurrentInput("Error");
            return;
          }
          res = 1 / val;
          label = `1/(${val})`;
        }

        const formatted = parseFloat(res.toFixed(10)).toString();
        setHistory((prev) => [
          {
            id: Date.now(),
            expression: label,
            result: formatted,
            time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })
          },
          ...prev.slice(0, 19)
        ]);

        setCurrentInput(formatted);
        setOverwrite(true);
      };

      const handleCopy = () => {
        if (currentInput === "Error") return;
        navigator.clipboard.writeText(currentInput);
        setCopied(true);
        setTimeout(() => setCopied(false), 1500);
      };

      const handleHistorySelect = (val) => {
        setCurrentInput(val);
        setOverwrite(true);
      };

      const clearHistory = () => {
        setHistory([]);
      };

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key >= "0" && e.key <= "9") {
            handleNumber(e.key);
          } else if (e.key === ".") {
            handleDecimal();
          } else if (e.key === "+") {
            handleOperator("+");
          } else if (e.key === "-") {
            handleOperator("-");
          } else if (e.key === "*") {
            handleOperator("×");
          } else if (e.key === "/") {
            e.preventDefault();
            handleOperator("÷");
          } else if (e.key === "Enter" || e.key === "=") {
            e.preventDefault();
            handleEquals();
          } else if (e.key === "Backspace") {
            handleDelete();
          } else if (e.key === "Escape") {
            handleAllClear();
          } else if (e.key === "%") {
            handlePercentage();
          }
        };

        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      });

      return (
        <div className="app">
          <header>
            <h1>🎓 College Smart Calculator</h1>
            <p>Interactive lab calculator with memory & history</p>
          </header>

          <div className="summary">
            <div className="summary-card total">
              <h3>Calculations Done</h3>
              <p>{totalCalculations}</p>
            </div>
            <div className="summary-card present-card">
              <h3>Last Result</h3>
              <p>{lastResult.length > 7 ? `${lastResult.slice(0, 6)}…` : lastResult}</p>
            </div>
            <div className="summary-card active-op-card">
              <h3>Active Operator</h3>
              <p>{operation ? operation : "Ready"}</p>
            </div>
          </div>

          <div className="calculator-workspace">
            <div className="calculator-card">
              <div className="calculator-top-bar">
                <span className="college-badge">ENG LAB EDITION</span>
                <button className="copy-btn" onClick={handleCopy} title="Copy to clipboard">
                  {copied ? "✓ Copied" : "📋 Copy"}
                </button>
              </div>

              <div className="display-screen">
                <div className="expression-line">
                  {previousInput !== null && operation ? `${previousInput} ${operation}` : "\u00A0"}
                </div>
                <div className={`main-line ${currentInput.length > 10 ? "text-shrink" : ""}`}>
                  {currentInput}
                </div>
              </div>

              <div className="quick-helpers">
                <button onClick={() => handleQuickMath("sq")} title="Square">x²</button>
                <button onClick={() => handleQuickMath("sqrt")} title="Square Root">√x</button>
                <button onClick={() => handleQuickMath("inv")} title="Reciprocal">1/x</button>
                <button onClick={handlePercentage} title="Percentage">%</button>
              </div>

              <div className="keypad">
                <button className="btn-function" onClick={handleAllClear}>AC</button>
                <button className="btn-function" onClick={handleDelete}>⌫</button>
                <button className="btn-function" onClick={handleToggleSign}>±</button>
                <button
                  className={`btn-operator ${operation === "÷" ? "op-selected" : ""}`}
                  onClick={() => handleOperator("÷")}
                >
                  ÷
                </button>

                <button className="btn-number" onClick={() => handleNumber("7")}>7</button>
                <button className="btn-number" onClick={() => handleNumber("8")}>8</button>
                <button className="btn-number" onClick={() => handleNumber("9")}>9</button>
                <button
                  className={`btn-operator ${operation === "×" ? "op-selected" : ""}`}
                  onClick={() => handleOperator("×")}
                >
                  ×
                </button>

                <button className="btn-number" onClick={() => handleNumber("4")}>4</button>
                <button className="btn-number" onClick={() => handleNumber("5")}>5</button>
                <button className="btn-number" onClick={() => handleNumber("6")}>6</button>
                <button
                  className={`btn-operator ${operation === "-" ? "op-selected" : ""}`}
                  onClick={() => handleOperator("-")}
                >
                  −
                </button>

                <button className="btn-number" onClick={() => handleNumber("1")}>1</button>
                <button className="btn-number" onClick={() => handleNumber("2")}>2</button>
                <button className="btn-number" onClick={() => handleNumber("3")}>3</button>
                <button
                  className={`btn-operator ${operation === "+" ? "op-selected" : ""}`}
                  onClick={() => handleOperator("+")}
                >
                  +
                </button>

                <button className="btn-number btn-zero" onClick={() => handleNumber("0")}>0</button>
                <button className="btn-number" onClick={handleDecimal}>.</button>
                <button className="btn-equals" onClick={handleEquals}>=</button>
              </div>
            </div>

            <div className="history-panel">
              <div className="history-header">
                <h3>📜 Calculation History</h3>
                {history.length > 0 && (
                  <button className="reset-btn" onClick={clearHistory}>
                    ↻ Clear
                  </button>
                )}
              </div>

              <div className="history-list">
                {history.length === 0 ? (
                  <div className="history-empty">
                    <span className="empty-icon">💡</span>
                    <p>No calculations yet.</p>
                    <small>Perform an operation to view history log</small>
                  </div>
                ) : (
                  history.map((item) => (
                    <div
                      key={item.id}
                      className="history-item"
                      onClick={() => handleHistorySelect(item.result)}
                      title="Click to load into display"
                    >
                      <div className="history-top">
                        <span className="history-expr">{item.expression}</span>
                        <span className="history-time">{item.time}</span>
                      </div>
                      <div className="history-result">= {item.result}</div>
                    </div>
                  ))
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CalculatorApp />);
  </script>
</body>
</html>
